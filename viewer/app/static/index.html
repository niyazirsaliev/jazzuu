<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b0f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Jazzuu" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="stylesheet" href="/app.css" />
<title>Jazzuu</title>
<style>
  html,body{background:#0b0b0f;color:#f2f2f5;-webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:0;height:0;}
  .safe-t{padding-top:max(env(safe-area-inset-top),0px);}
  .safe-b{padding-bottom:max(env(safe-area-inset-bottom),0px);}
  .fade-in{animation:fi .28s ease both;}
  @keyframes fi{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .shimmer{background:linear-gradient(100deg,#1c1c24 30%,#242430 50%,#1c1c24 70%);background-size:200% 100%;animation:sh 1.3s infinite;}
  @keyframes sh{to{background-position:-200% 0;}}
  .transcript{white-space:pre-wrap;line-height:1.7;font-size:15.5px;}
  mark{background:transparent;color:#a99bff;font-weight:600;}
  audio{width:100%;height:40px;}
</style>
</head>
<body class="font-sans min-h-screen">
  <div id="app"></div>
  <script src="/asr-progress.js"></script>
  <script src="/identity-selector.js?v=1"></script>
  <script src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
    }
  </script>
</body>
</html>
